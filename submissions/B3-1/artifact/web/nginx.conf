server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    location = /health {
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "OK\n";
    }
    location / { try_files $uri $uri/ =404; }
}
