<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나만의 용돈 기입장</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><header><div><p class="eyebrow">MY ALLOWANCE LEDGER</p><h1>나만의 용돈 기입장</h1><p class="intro">오늘의 기록으로, 이번 달의 소비를 한눈에.</p></div><a class="deck" href="/presentation/index.html">발표자료 보기 ↗</a></header>
<div class="toolbar"><label>조회 월 <input id="month" type="month" required></label><p>데이터는 이 브라우저에 저장됩니다. 계산과 검증은 Python으로 처리합니다.</p><button id="backup" class="secondary">백업 다운로드</button></div>
<p id="status" role="status" aria-live="polite"></p>
<section class="cards" aria-label="월간 요약"><article><span>수입</span><strong id="income">—</strong></article><article><span>지출</span><strong id="expense">—</strong></article><article><span>잔액</span><strong id="balance">—</strong></article><article><span>예산 대비 지출</span><strong id="budget-value">미설정</strong><small id="budget-detail"></small></article></section>
<div class="workspace"><section class="panel entry"><h2>거래 기록</h2><form id="transaction-form"><div class="pair"><label>구분<select id="type"><option value="expense">지출</option><option value="income">수입</option></select></label><label>날짜<input id="date" type="date" required></label></div><div class="pair"><label>카테고리<select id="category" required></select></label><label>금액 (원)<input id="amount" type="number" min="1" step="1" inputmode="numeric" placeholder="5000" required></label></div><label>메모<input id="memo" maxlength="500" placeholder="예: 친구와 점심"></label><label>태그<input id="tags" placeholder="쉼표로 구분 · 예: 학교, 점심"></label><div class="form-actions"><button type="submit">기록 저장</button><button id="sample" type="button" class="secondary">입력 예시</button></div></form><div class="budget-section"><h2>월 예산 설정</h2><form id="budget-form"><label><span id="budget-month"></span> 예산 (원)<input id="budget-amount" type="number" min="1" step="1" placeholder="100000" required></label><button type="submit" class="secondary">예산 저장</button></form></div></section>
<section class="panel ledger"><div class="list-heading"><h2>거래 내역 <span id="count"></span></h2><label class="search"><span class="sr-only">거래 검색</span><input id="search" type="search" placeholder="카테고리 · 메모 · 태그 검색"></label></div><div id="transactions" class="transactions"></div><h3>카테고리별 지출</h3><div id="category-totals" class="totals"></div></section></div><footer>실제 Python 서비스 로직을 체험하는 발표용 웹 화면입니다.</footer></main></body></html>
