name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deactivate stale github-pages deployments
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentSha = context.sha;
            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              {
                owner,
                repo,
                environment: "github-pages",
                per_page: 100,
              }
            );

            for (const deployment of deployments) {
              if (deployment.sha === currentSha) continue;

              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                owner,
                repo,
                deployment_id: deployment.id,
                per_page: 10,
              });

              const active = statuses.find((status) =>
                ["in_progress", "queued", "pending", "waiting"].includes(status.state)
              );

              if (!active) continue;

              core.info(`Deactivate deployment ${deployment.id} (${deployment.sha})`);
              await github.rest.repos.createDeploymentStatus({
                owner,
                repo,
                deployment_id: deployment.id,
                state: "inactive",
                description: "Superseded by newer Pages deployment",
              });
            }

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
